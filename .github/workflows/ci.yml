# CI for phocinae-server.
#
# The suite that runs here is the one that is actually verifiable without the
# model: `tests/test_router.py` runs its model-free checks always and SKIPs the
# model-dependent half (exit 0) when PHOC_MODEL_DIR is unset — which is exactly
# the situation in CI. The weights are a ~330 MB Hugging Face repo, so fetching
# them here is deliberately out of scope.
#
# Dependency policy — install exactly what the test file imports, nothing more.
#   * `tests/test_router.py` imports only json/os/subprocess/sys/time at module
#     scope (all stdlib). It does NOT import torch or requests at module scope.
#   * Its model-free half imports `phocinae.router`, which imports `requests` at
#     module scope but NOT torch, and `phocinae/__init__.py` imports nothing at
#     all — so importing phocinae.router pulls in requests and nothing heavy.
#     The loopback/proxy test also imports `requests` directly.
#   => `pip install -e . --no-deps` + `pip install requests`.
#   torch / numpy / fastapi / uvicorn are intentionally NOT installed: main()
#   skips the model-dependent half when PHOC_MODEL_DIR is unset *or* torch is
#   missing, so the model-free checks run clean either way and the CPU torch
#   wheel (~200 MB) would buy no extra coverage. Verified locally with exactly
#   this install set and PHOC_MODEL_DIR unset — the run ends with
#     test_router: SKIPPED the model-dependent half (PHOC_MODEL_DIR is not set);
#                 12 model-free checks passed
#   and exits 0. `requests` is strictly optional to the suite (that half prints
#   its own SKIP if it is missing) but installing it keeps those 4 checks live.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # 非 UTF-8 控制台（windows runner 是 cp1252/437）下，打印非 ASCII 会抛
  # UnicodeEncodeError 把 job 拖红。脚本自身已 reconfigure 兜底，
  # 这里覆盖 pip/build 与子进程的输出。
  PYTHONUTF8: '1'

jobs:
  test:
    name: router checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the minimum the model-free checks import
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install requests

      # PHOC_MODEL_DIR is unset on purpose: the model half SKIPs cleanly (exit 0)
      # and the run stays fast and self-contained.
      - name: Model-free router checks
        run: python tests/test_router.py

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This only proves the package builds from a clean checkout. It does not
      # publish anything — release.yml owns publishing, and it builds into its
      # own directory instead of dist/.
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
