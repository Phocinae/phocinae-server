[project]
name = "phocinae-server"
version = "0.1.6"
description = "Self-contained typed-decisions (system-one) inference server for the Phocinae-Largha-150M-v1 model"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["decision-model", "typed-decisions", "structured-decisions", "small-model", "cpu-inference"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "torch>=2.1",
    "requests>=2.25",
    # engine.run() moves the forward-pass tensors to host memory via
    # Tensor.numpy() (phocinae/engine.py, _decode_rows call site). torch does
    # NOT install numpy, so without this declaration every POST /v1/systemone
    # failed with "RuntimeError: Numpy is not available" (HTTP 500) on a clean
    # `pip install phocinae-server`.
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/Phocinae/phocinae-server"
Repository = "https://github.com/Phocinae/phocinae-server"
"Bug Tracker" = "https://github.com/Phocinae/phocinae-server/issues"

[tool.setuptools]
packages = ["phocinae"]
