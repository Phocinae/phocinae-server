[project]
name = "phocinae-server"
version = "0.1.0"
description = "Self-contained typed-decisions (system-one) inference server for the Phocinae-Largha-150M-v1 model"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "torch>=2.1",
    "requests>=2.25",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["phocinae"]
