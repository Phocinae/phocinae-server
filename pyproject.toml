[project]
name = "phocinae-server"
version = "0.1.5"
description = "Self-contained typed-decisions (system-one) inference server for the Phocinae-Largha-150M-v1 model"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["decision-model", "typed-decisions", "structured-decisions", "small-model", "cpu-inference"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "torch>=2.1",
    "requests>=2.25",
]

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/Phocinae/phocinae-server"
Repository = "https://github.com/Phocinae/phocinae-server"
"Bug Tracker" = "https://github.com/Phocinae/phocinae-server/issues"

[tool.setuptools]
packages = ["phocinae"]
